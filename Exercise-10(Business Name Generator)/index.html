<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Program is lengthy cuz we are restricted to not use array here -->
    <script>
        let rand=Math.random()
        let first,second,third;
        // let's generate the first word
        if(rand<0.33){
            first="Crazy"
        }
        else if(rand<0.66 && rand>=0.33){
            first="Amazing"
        }
        else{
            first="Fire"
        }
        // let's generate the second word
        rand=Math.random()
        if(rand<0.33){
            second="Engine"
        }
        else if(rand<0.66 && rand>=0.33){
            second="Foods"
        }
        else{
            second="Garments"
        }
        // let's generate the third word
        rand=Math.random()
        if(rand<0.33){
            third="Bros"
        }
        else if(rand<0.66 && rand>=0.33){
            third="limited"
        }
        else{
            third="Hub"
        }
        console.log(`${first} ${second} ${third}`)
    </script>
</body>
</html>
